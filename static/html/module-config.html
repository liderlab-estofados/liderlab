<div class="floating-module-config">
  <h6>Configurar Módulo</h6>

  <div class="mb-2">
    <label class="form-label small">Modelo:</label>
    <input type="text" class="form-control form-control-sm" id="modelo-field" readonly>
  </div>

  <div class="mb-2">
    <label class="form-label small">Módulo:</label>
    <select class="form-select form-select-sm" id="modulo-select"></select>
  </div>

  <div class="mb-2">
    <label class="form-label small">Largura (mm):</label>
    <select class="form-select form-select-sm" id="largura-select"></select>
  </div>

  <div class="mb-2">
    <label class="form-label small">Profundidade (mm):</label>
    <select class="form-select form-select-sm" id="profundidade-select"></select>
  </div>

  <div class="mb-2">
    <label class="form-label small">Opcional 1:</label>
    <select class="form-select form-select-sm" id="opcional1-select"></select>
  </div>

  <div class="d-flex justify-content-end">
    <button type="button" class="btn btn-secondary btn-sm me-1" id="close-config">Fechar</button>
    <button type="button" class="btn btn-primary btn-sm" style="background-color: #bdb8a6;"
      id="apply-config">Aplicar</button>
  </div>
</div>
